<!DOCTYPE html>
<html lang="en">

<head>

</head>

<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Control Lampara RGB</h1>
            <button id="power-button" class="active" onclick="onPowerButtonClick(event)">
                <svg fill="#ffffff" viewBox="-2 0 19 19" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff"
                    stroke-width="0.00019">
                    <path
                        d="M7.498 17.1a7.128 7.128 0 0 1-.98-.068 7.455 7.455 0 0 1-1.795-.483 7.26 7.26 0 0 1-3.028-2.332A7.188 7.188 0 0 1 .73 12.52a7.304 7.304 0 0 1 .972-7.128 7.221 7.221 0 0 1 1.387-1.385 1.03 1.03 0 0 1 1.247 1.638 5.176 5.176 0 0 0-.993.989 5.313 5.313 0 0 0-.678 1.181 5.23 5.23 0 0 0-.348 1.292 5.22 5.22 0 0 0 .326 2.653 5.139 5.139 0 0 0 .69 1.212 5.205 5.205 0 0 0 .992.996 5.257 5.257 0 0 0 1.178.677 5.37 5.37 0 0 0 1.297.35 5.075 5.075 0 0 0 1.332.008 5.406 5.406 0 0 0 1.32-.343 5.289 5.289 0 0 0 2.211-1.682 5.18 5.18 0 0 0 1.02-2.465 5.2 5.2 0 0 0 .01-1.336 5.315 5.315 0 0 0-.343-1.318 5.195 5.195 0 0 0-.695-1.222 5.134 5.134 0 0 0-.987-.989 1.03 1.03 0 1 1 1.24-1.643 7.186 7.186 0 0 1 1.384 1.386 7.259 7.259 0 0 1 .97 1.706 7.413 7.413 0 0 1 .473 1.827 7.296 7.296 0 0 1-4.522 7.65 7.476 7.476 0 0 1-1.825.471 7.203 7.203 0 0 1-.89.056zM7.5 9.613a1.03 1.03 0 0 1-1.03-1.029V2.522a1.03 1.03 0 0 1 2.06 0v6.062a1.03 1.03 0 0 1-1.03 1.03z">
                    </path>
                </svg>
                <span style="pointer-events: none;">APAGAR</span>
            </button>
        </div>
        <div class="led-stripe">
        </div>
        <div class="brightness">
            <label for="brightness-slider">Brillo:</label>
            <input type="range" min="0" max="255" value="255" id="brightness-slider"
                onInput="onBrightnessChange(event)">
        </div>
        <div class="controls">
            <button id="rgb-selector" onclick="onRGBButtonClick(event)">
                <svg height="20px" width="20px" viewBox="-10.22 -10.22 275.95 275.95" xmlns="http://www.w3.org/2000/svg"
                    fill="#ffffff" stroke="#ffffff" stroke-width="7.920841">
                    <path
                        d="M34.674,185.63V20.717c0-3.008-2.431-5.439-5.439-5.439s-5.439,2.431-5.439,5.439v164.907 C10.274,188.186,0,200.049,0,214.31c0,16.116,13.114,29.235,29.235,29.235S58.47,230.426,58.47,214.31 C58.47,200.054,48.196,188.186,34.674,185.63z M29.235,232.672c-10.122,0-18.357-8.24-18.357-18.357 c0-10.122,8.235-18.357,18.357-18.357s18.357,8.235,18.357,18.357S39.357,232.672,29.235,232.672z">
                    </path>
                    <path

                    </path>
                    <path
                        d="M132.12,97.419V20.717c0-3.008-2.431-5.439-5.439-5.439c-3.002,0-5.439,2.431-5.439,5.439v76.702 c-13.522,2.562-23.796,14.424-23.796,28.68s10.274,26.124,23.796,28.68v76.702c0,3.008,2.437,5.439,5.439,5.439 c3.008,0,5.439-2.431,5.439-5.439v-76.696c13.522-2.562,23.796-14.424,23.796-28.68S145.647,99.981,132.12,97.419z M132.12,143.542c-1.724,0.544-3.525,0.914-5.439,0.914c-1.904,0-3.709-0.37-5.439-0.914c-7.452-2.339-12.918-9.23-12.918-17.443 s5.466-15.104,12.918-17.443c1.73-0.544,3.535-0.914,5.439-0.914c1.915,0,3.715,0.37,5.439,0.914 c7.457,2.339,12.918,9.23,12.918,17.443S139.577,141.209,132.12,143.542z">
                    </path>
                </svg>
                Seleccionar RGB
            </button>
            <button id="color-Picker" onclick="onImgButtonClick(event)">
                <svg viewBox=" 0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
                    <path
                        d="M14.2639 15.9375L12.5958 14.2834C11.7909 13.4851 11.3884 13.086 10.9266 12.9401C10.5204 12.8118 10.0838 12.8165 9.68048 12.9536C9.22188 13.1095 8.82814 13.5172 8.04068 14.3326L4.04409 18.2801M14.2639 15.9375L14.6053 15.599C15.4112 14.7998 15.8141 14.4002 16.2765 14.2543C16.6831 14.126 17.12 14.1311 17.5236 14.2687C17.9824 14.4251 18.3761 14.8339 19.1634 15.6514L20 16.4934M14.2639 15.9375L18.275 19.9565M18.275 19.9565C17.9176 20 17.4543 20 16.8 20H7.2C6.07989 20 5.51984 20 5.09202 19.782C4.71569 19.5903 4.40973 19.2843 4.21799 18.908C4.12796 18.7313 4.07512 18.5321 4.04409 18.2801M18.275 19.9565C18.5293 19.9256 18.7301 19.8727 18.908 19.782C19.2843 19.5903 19.5903 19.2843 19.782 18.908C20 18.4802 20 17.9201 20 16.8V16.4934M4.04409 18.2801C4 17.9221 4 17.4575 4 16.8V7.2C4 6.0799 4 5.51984 4.21799 5.09202C4.40973 4.71569 4.71569 4.40973 5.09202 4.21799C5.51984 4 6.07989 4 7.2 4H16.8C17.9201 4 18.4802 4 18.908 4.21799C19.2843 4.40973 19.5903 4.71569 19.782 5.09202C20 5.51984 20 6.0799 20 7.2V16.4934M17 8.99989C17 10.1045 16.1046 10.9999 15 10.9999C13.8954 10.9999 13 10.1045 13 8.99989C13 7.89532 13.8954 6.99989 15 6.99989C16.1046 6.99989 17 7.89532 17 8.99989Z"
                        stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                Color de Imagen
            </button>
            <button id="rainbow" onclick="onRainbowButtonClick(event)">
                <svg fill="#ffffff" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
                    <path
                        d="M23,17a1,1,0,0,1-2,0A9,9,0,0,0,3,17a1,1,0,0,1-2,0,11,11,0,0,1,22,0ZM12,10a7.008,7.008,0,0,0-7,7,1,1,0,0,0,2,0,5,5,0,0,1,10,0,1,1,0,0,0,2,0A7.009,7.009,0,0,0,12,10Zm0,4a3,3,0,0,0-3,3,1,1,0,0,0,2,0,1,1,0,0,1,2,0,1,1,0,0,0,2,0A3,3,0,0,0,12,14Z">
                    </path>
                </svg>
                Arcoiris
            </button>
            <button id="breathe" onclick="onBreatheButtonClick(event)">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
                    <path
                        d="M8 12H14M5 9H16.5C17.8807 9 19 7.88071 19 6.5C19 5.11929 17.8807 4 16.5 4M4 15H17C18.1046 15 19 15.8954 19 17C19 18.1046 18.1046 19 17 19"
                        stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                Respiracion
            </button>

            <button id="audio" onclick="onAudioButtonClick(event)">
                <svg fill="white" width="20px" height="20px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M13,4V20a1,1,0,0,1-2,0V4a1,1,0,0,1,2,0ZM8,5A1,1,0,0,0,7,6V18a1,1,0,0,0,2,0V6A1,1,0,0,0,8,5ZM4,7A1,1,0,0,0,3,8v8a1,1,0,0,0,2,0V8A1,1,0,0,0,4,7ZM16,5a1,1,0,0,0-1,1V18a1,1,0,0,0,2,0V6A1,1,0,0,0,16,5Zm4,2a1,1,0,0,0-1,1v8a1,1,0,0,0,2,0V8A1,1,0,0,0,20,7Z" />
                </svg>
                Audio
            </button>
            <button id="pulse" onclick="onPulseButtonClick(event)">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
                    <path
                        d="M5 14.9999H6.39445C7.1804 14.9999 7.57337 14.9999 7.90501 15.1774C8.23665 15.3549 8.45463 15.6819 8.8906 16.3358L9.05039 16.5755C9.47306 17.2095 9.68439 17.5265 9.97087 17.5095C10.2573 17.4925 10.4297 17.1527 10.7743 16.4731L12.7404 12.5964C13.0987 11.8898 13.2779 11.5365 13.5711 11.5247C13.8642 11.5129 14.0711 11.8508 14.485 12.5264L15.1222 13.5668C15.5512 14.2671 15.7656 14.6172 16.1072 14.8086C16.4487 14.9999 16.8593 14.9999 17.6805 14.9999H19"
                        stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"></path>
                    <path
                        d="M22 12C22 16.714 22 19.0711 20.5355 20.5355C19.0711 22 16.714 22 12 22C7.28595 22 4.92893 22 3.46447 20.5355C2 19.0711 2 16.714 2 12C2 7.28595 2 4.92893 3.46447 3.46447C4.92893 2 7.28595 2 12 2C16.714 2 19.0711 2 20.5355 3.46447C21.5093 4.43821 21.8356 5.80655 21.9449 8"
                        stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"></path>
                </svg>
                Pulso
            </button>
        </div>
        <div class="panel">
            <p id="title">Selecciona un color para la lampara RGB</p>
            <div class="rgb-tab">
                <div style="display: flex; flex-direction: row; align-items: start; gap: 10px;">
                    <div>
                        <label for="colorInput">Seleccion de color:</label>
                        <input type="color" id="colorInput" value="#ffffff" list="presetColors"
                            onchange="onColorChange(event)">
                    </div>
                    <datalist id="presetColors">
                        <option value="#B76B75">Rosa</option>
                        <option value="#e81416">Rojo</option>
                        <option value="#ffa500">Naranja</option>
                        <option value="#faeb36">Amarillo</option>
                        <option value="#79c314">Verde</option>
                        <option value="#487de7">Azul</option>
                        <option value="#4b369d">Indigo</option>
                        <option value="#70369d">Violeta</option>
                    </datalist>
                    <div>
                        <label id="redLabel" for="redSlider">Rojo:</label>
                        <input type="range" id="redSlider" min="0" max="255" value="255" oninput="onRedChange(event)">
                        <label id="greenLabel" for="greenSlider">Verde:</label>
                        <input type="range" id="greenSlider" min="0" max="255" value="255"
                            oninput="onGreenChange(event)">
                        <label id=" blueLabel" for="blueSlider">Azul:</label>
                        <input type="range" id="blueSlider" min="0" max="255" value="255" oninput="onBlueChange(event)">
                    </div>
                </div>
                <div>
                    <label for="colorInput">Ingresa un color por su valor HEX:</label>
                    <input type="text" id="colorValue" value="#ffffff" oninput="onHexInputChange(event)" maxlength="7">
                </div>
            </div>
            <div class="image-tab">
                <label id="fileLabel" for="imageInput">
                    <div class="dragAndDrop" ondragover="event.preventDefault()" ondrop="onImageDrop(event)">
                        Arrastra una Imagen aqui, sube o toma una foto para elegir un color
                    </div>
                </label>
                <input type="file" id="imageInput" accept="image/*" onchange="loadImage(event)">
                <canvas id="imageCanvas" style="display: none;"></canvas>
                </canvas>
            </div>
        </div>
    </div>

</body>

</html>
