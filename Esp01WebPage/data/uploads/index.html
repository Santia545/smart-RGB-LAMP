        <div class="panel">
            <p id="title">Selecciona un color para la lampara RGB</p>
            <div class="rgb-tab">
                <div style="display: flex; flex-direction: row; align-items: start; gap: 10px;">
                    <div>
                        <label for="colorInput">Seleccion de color:</label>
                        <input type="color" id="colorInput" value="#ffffff" list="presetColors"
                            onchange="onColorChange(event)">
                    </div>
                    <datalist id="presetColors">
                        <option value="#B76B75">Rosa</option>
                        <option value="#e81416">Rojo</option>
                        <option value="#ffa500">Naranja</option>
                        <option value="#faeb36">Amarillo</option>
                        <option value="#79c314">Verde</option>
                        <option value="#487de7">Azul</option>
                        <option value="#4b369d">Indigo</option>
                        <option value="#70369d">Violeta</option>
                    </datalist>
                    <div>
                        <label id="redLabel" for="redSlider">Rojo:</label>
                        <input type="range" id="redSlider" min="0" max="255" value="255" oninput="onRedInput(event) "
                            onchange="onRedChange(event)">
                        <label id="greenLabel" for="greenSlider">Verde:</label>
                        <input type="range" id="greenSlider" min="0" max="255" value="255"
                            oninput="onGreenInput(event) " onchange="onGreenChange(event)">
                        <label id=" blueLabel" for="blueSlider">Azul:</label>
                        <input type="range" id="blueSlider" min="0" max="255" value="255" oninput="onBlueInput(event) "
                            onchange="onBlueChange(event)">
                    </div>
                </div>
                <div>
                    <label for="colorInput">Ingresa un color por su valor HEX:</label>
                    <input type="text" id="colorValue" value="#ffffff" oninput="onHexInputChange(event)" maxlength="7">
                </div>
            </div>
            <div class="image-tab">
                <label id="fileLabel" for="imageInput">
                    <div class="dragAndDrop" ondragover="event.preventDefault()" ondrop="onImageDrop(event)">
                        Arrastra una Imagen aqui, sube o toma una foto para elegir un color
                    </div>
                </label>
                <input type="file" id="imageInput" accept="image/*" onchange="loadImage(event)">
                <canvas id="imageCanvas" style="display: none;"></canvas>
                </canvas>
            </div>
            <div class="pulse-tab">
                <div class="switch-container" style="align-self: flex-start;">
                    <p id="info">Pulso suave</p>
                    <label class="switch">
                        <input type="checkbox" onchange="">
                        <span class="slider"></span>
                    </label>
                </div>
                <div>
                    <label for="pulseInput">Ingresa los pulsos por minuto:</label>
                    <input type="text" id="pulseInput" value="60" maxlength="3" oninput="onPulseInputChange(event)"
                        min="10" max="300">
                </div>
            </div>
            <div class="candle-tab">
                <div class="switches">
                    <div class="switch-container">
                        <p id="info"> Iluminacion Parpadeante</p>
                        <label class="switch">
                            <input type="checkbox" onchange="">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="switch-container">
                        <p id="info"> Usar temperatura de color</p>
                        <label class="switch">
                            <input type="checkbox" onchange="onColorTemperatureSwitchChange(event)">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <label id="temperatureLabel" for="colorTemperatureSlider">Temperatura de Color, de 1000K( Rojo) a
                    12000K( Azul):</label>
                <input type="range" min="1000" max="12000" step="100" value="6500" id="colorTemperatureSlider"
                    onInput="onColorTemperatureInput(event)" onchange="onColorTemperatureChange(event)" disabled>
            </div>
        </div>
    </div>

</body>

</html>
